# ThunderGate tooling configuration.
#
# Runtime dependencies live in requirements.txt; this file holds the
# ruff lint configuration.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Lint for real breakage -- syntax errors (E9) and pyflakes findings (F)
# -- rather than style.
select = ["E9", "F"]
